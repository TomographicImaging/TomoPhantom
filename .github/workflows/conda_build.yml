name: conda
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
      - uses: prefix-dev/rattler-build-action@v0.2.37
        with:
          recipe-path: recipe.yaml
          build-args: --experimental
          artifact-name: package-${{ matrix.os }}
      - if: startsWith(matrix.os, 'ubuntu')
        name: check glibc support
        env:
          GLIBC_MAX: '2.28' # see recipe.yaml
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          unzip -q output/*/lib*.conda 'pkg-*' -d "$d"
          tar --zstd -xf "$d"/pkg-*.tar.zst -C "$d"
          max=$(objdump -T "$d"/lib/libtomophantom.so | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "expected max glibc symbol: GLIBC_${GLIBC_MAX} ; found: $max"
          if [[ $(printf '%s\n%s\n' "$GLIBC_MAX" "${max#GLIBC_}" | sort -V | tail -1) != "$GLIBC_MAX" ]] ; then
            echo "FAIL: $max > GLIBC_${GLIBC_MAX}" >&2
            exit 1
          fi
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        name: conda upload -c httomo
        run: |
          rattler-build upload anaconda -o httomo -f ./output/*/lib*.conda     # library
          if [[ ${{ matrix.os }} =~ ubuntu* ]] ; then
            rattler-build upload anaconda -o httomo -f ./output/noarch/*.conda # noarch: python
          fi
        shell: bash
        env:
          ANACONDA_API_KEY: ${{ secrets.HTTOMO_TOKEN_27 }}
